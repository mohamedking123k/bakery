<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مخبز يونس">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F4EF">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>مخبز يونس — دفتر المخبز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@900&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#F6F4EF;--surface:#FFFFFF;--surface-2:#F4F0E8;--ink:#2B1E10;--muted:#7A6D5C;--line:#E7E0D3;
  --brand:#C27A1A;--brand-deep:#8E5612;--brand-soft:#F8ECD6;
  --pri:#3B2611;--pri-ink:#FFFFFF;
  --debt:#B3261E;--debt-soft:#FBE5E2;--ok:#2E7A4D;--ok-soft:#E2F1E7;--warn-soft:#FFF4DE;
  --shade:rgba(43,30,16,.45);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14100B;--surface:#1E1912;--surface-2:#28211A;--ink:#F4ECE0;--muted:#B5A895;--line:#3A3126;
  --brand:#E2A54E;--brand-deep:#EAB665;--brand-soft:#3A2B17;--pri:#E2A54E;--pri-ink:#1A1208;
  --debt:#F28B82;--debt-soft:#3D1F1C;--ok:#7FCB9C;--ok-soft:#1C3325;--warn-soft:#3A2E17;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100B;--surface:#1E1912;--surface-2:#28211A;--ink:#F4ECE0;--muted:#B5A895;--line:#3A3126;
  --brand:#E2A54E;--brand-deep:#EAB665;--brand-soft:#3A2B17;--pri:#E2A54E;--pri-ink:#1A1208;
  --debt:#F28B82;--debt-soft:#3D1F1C;--ok:#7FCB9C;--ok-soft:#1C3325;--warn-soft:#3A2E17;--shade:rgba(0,0,0,.6);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Readex Pro',Tahoma,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.3;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.logo{color:var(--brand);display:block}
.logo .he{font-family:'Frank Ruhl Libre','Arial Hebrew','Times New Roman',serif;font-weight:900}
.logo .en{font-family:'Roboto Slab',Rockwell,Georgia,serif;font-weight:700}

/* layout */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;padding:20px 14px 14px;border-inline-end:1px solid var(--line);background:var(--surface);overflow-y:auto}
.side .brandbox{text-align:center;padding:4px 0 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.side .brandbox .logo{width:128px;height:auto;margin:0 auto 4px}
.side .brandbox small{color:var(--muted);font-size:13px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;font-weight:500;color:var(--ink)}
.nav a svg{width:21px;height:21px;color:var(--muted);flex:none}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.nav a[aria-current="page"] svg{color:var(--brand)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.sync{margin-top:auto;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:10px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.saving{background:var(--brand)}.dot.err{background:var(--debt)}.dot.local{background:var(--muted)}
main{padding:28px clamp(14px,3vw,40px) 120px;max-width:1100px;width:100%;margin:0 auto;min-width:0}
.topbar,.tabs{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
  .topbar .logo{width:44px;height:44px}
  .topbar b{font-size:18px;flex:1}
  .topbar .sync{margin:0;padding:0;font-size:12px}
  .topbar .sync span.t{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabh);text-decoration:none;font-size:11.5px;color:var(--muted);font-weight:500}
  .tabs a svg{width:23px;height:23px}
  .tabs a[aria-current="page"]{color:var(--brand-deep)}
  .tabs a[aria-current="page"] svg{color:var(--brand)}
  main{padding:16px 14px calc(var(--tabh) + 110px)}
}

/* common */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:clamp(24px,3.4vw,32px)}
.ph p{margin:2px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
h2.sec{font-size:19px;margin:28px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-size:13px;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card+.card{margin-top:12px}
.card h3{font-size:17px;margin-bottom:12px}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card .ch h3{margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.two .card+.card{margin-top:0}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:10px 2px}
.banner{background:var(--warn-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.d{color:var(--debt)}.okc{color:var(--ok)}

.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;font-size:15px}
.btn svg{width:19px;height:19px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;padding:0;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.tag{font-size:11.5px;padding:1px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.tag.w{background:var(--brand-soft);color:var(--brand-deep)}
.tag.m{background:var(--ok-soft);color:var(--ok)}
.pill{font-size:12.5px;padding:2px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
.pill:empty{display:none}
.st-paid{background:var(--ok-soft);color:var(--ok)}.st-part{background:var(--brand-soft);color:var(--brand-deep)}.st-due{background:var(--debt-soft);color:var(--debt)}.st-pay{background:var(--surface-2);color:var(--ink)}
input.n,input.t,select.t{width:100%;height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:0 10px;min-width:0}
input.n{text-align:center;font-size:18px;font-weight:600}
input.t,select.t{font-size:16px;padding:0 12px}
input.n:focus,input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--surface)}
input.n::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent);font-weight:400;font-size:15px}
input:disabled{opacity:.6}
textarea.t{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--muted)}
.search{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;min-width:0;width:100%;font-size:16px}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.dlabel{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.dlabel svg{width:22px;height:22px;color:var(--brand);flex:none}
.dlabel div{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.dlabel b{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlabel small{font-size:12.5px;color:var(--muted)}
.dlabel input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.datebar .btn{height:54px}

/* home */
.today{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:0;padding:0;overflow:hidden}
.tnet{background:var(--brand-soft);padding:20px;display:flex;flex-direction:column;justify-content:center}
.tnet>span{color:var(--brand-deep);font-size:14px;font-weight:500}
.tnet b{font-size:clamp(28px,4.4vw,40px);color:var(--brand-deep);line-height:1.15;margin-top:4px}
.tnet>small{color:var(--brand-deep);opacity:.8;font-size:13px;margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.tgrid div{background:var(--surface);padding:14px 18px}
.tgrid>div>span{display:block;color:var(--muted);font-size:13.5px}
.tgrid b{font-size:21px;font-weight:600}
@media (max-width:640px){.today{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:860px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:start;cursor:pointer;text-decoration:none;color:var(--ink);min-height:132px}
.tile:hover{border-color:var(--brand)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:13px;margin-top:-6px}
.tile small.ok{color:var(--ok)}.tile small.warn{color:var(--debt)}
.alist{display:flex;flex-direction:column}
.aitem{display:flex;align-items:center;gap:12px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);text-align:start;background:none;cursor:pointer;width:100%}
.aitem:last-child{border-bottom:0}
.aitem .mk{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.aitem .mk.r{background:var(--debt)}
.aitem div{flex:1;min-width:0}
.aitem b{font-weight:500;display:block}
.aitem small{color:var(--muted);font-size:13px}
.aitem .v{font-weight:600;white-space:nowrap}
.allgood{display:flex;gap:10px;align-items:center;color:var(--ok);padding:6px 0}
.allgood svg{width:20px;height:20px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini>div>span{display:block;font-size:13px;color:var(--muted)}
.mini b{font-size:19px;font-weight:600}

/* customer list rows (dist, customers) */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress .bar{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress span{font-size:14px;color:var(--muted);white-space:nowrap}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.clist{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer;min-height:68px}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow .av{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted);flex:none;font-size:16px}
.crow.done .av{background:var(--ok-soft);color:var(--ok)}
.crow.done .av svg{width:20px;height:20px}
.crow .cn{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .cn b{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cn small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.crow .cv b{font-weight:600;font-size:16px}
.crow .go{color:var(--brand-deep);font-weight:600;font-size:14px}
.crow .chev{width:18px;height:18px;color:var(--muted);flex:none}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .logo{width:140px;margin:0 auto 10px}
.empty h2{color:var(--ink);font-size:22px;margin-bottom:6px}
.sumbar{position:sticky;bottom:14px;z-index:15;margin-top:14px;background:var(--pri);color:var(--pri-ink);border-radius:16px;padding:12px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}
.sumbar>div>span{display:block;font-size:12px;opacity:.75}
.sumbar b{font-size:17px}
@media (max-width:860px){.sumbar{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px)}}

/* entry page */
.ebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ehead{margin-bottom:14px}
.ehead h1{font-size:clamp(26px,5vw,34px)}
.ehead .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);margin-top:4px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .ql b{display:block;font-size:17px;font-weight:600}
.qrow .ql small{color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:46px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:500;cursor:pointer;line-height:1}
.step button:active{background:var(--brand-soft)}
.step input.n{width:84px;height:50px;font-size:20px}
.qrow.ret .ql b{font-size:15px;font-weight:500}
.payrow{display:flex;gap:8px;align-items:stretch}
.payrow input.n{height:54px;font-size:22px}
.payrow .btn{height:54px}
.calc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;background:var(--surface-2);border-radius:14px;padding:12px}
.calc3>div>span{display:block;font-size:12.5px;color:var(--muted)}
.calc3 b{font-size:18px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--brand-deep);font-weight:500;cursor:pointer;padding:12px 0 0;font-size:15px}
.extra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;margin-top:10px}
.extra[hidden]{display:none}
.ebottom{position:sticky;bottom:14px;z-index:15;margin-top:14px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 30px -16px rgba(0,0,0,.4)}
.ebottom .tot{flex:1;min-width:0;padding:0 8px;line-height:1.25}
.ebottom .tot>span{display:block;font-size:12.5px;color:var(--muted)}
.ebottom .tot b{font-size:19px}
.ebottom .btn{height:50px}
@media (max-width:860px){.ebottom{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px)}}

/* ledger strip (reports, statement, debts) */
.ledger{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ledger>div{background:var(--surface);padding:14px 16px;min-width:0}
.ledger>div>span{display:block;color:var(--muted);font-size:13px}
.ledger b{display:block;font-size:clamp(18px,2.2vw,24px);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.ledger .net{background:var(--brand-soft)}
.ledger .net b,.ledger .net>span,.ledger .net em{color:var(--brand-deep)}
.ledger .debt b{color:var(--debt)}
.up{color:var(--ok)!important}.down{color:var(--debt)!important}
@media (max-width:720px){.ledger{grid-template-columns:1fr 1fr}.ledger>div:last-child:nth-child(odd){grid-column:1/-1}}

/* daily */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.calcline{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0;font-size:14px;color:var(--muted)}
.calcline b{color:var(--ink);font-weight:600}
.daily{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start}
.daily .stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.daily .stack .card+.card{margin-top:0}
.dsum{position:sticky;top:20px}
@media (max-width:900px){.daily{grid-template-columns:minmax(0,1fr)}.dsum{position:static}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.kv.big{padding:14px 12px;margin:4px -12px;background:var(--brand-soft);border-radius:12px;border:0}
.kv.big span{color:var(--brand-deep);align-self:center}
.kv.big b{font-size:24px;color:var(--brand-deep)}

/* debts */
.drow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drow:last-child{border-bottom:0}
.drow .who{flex:1;min-width:150px}
.drow .who b{font-weight:600;font-size:16px;margin-inline-end:8px}
.drow .who small{display:block;color:var(--muted);font-size:13px}
.drow .who small.late{color:var(--debt)}
.drow .amt{font-size:19px;font-weight:600;color:var(--debt);white-space:nowrap}
.drow .act{display:flex;gap:6px}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{color:var(--muted);font-weight:500;text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
.tbl th.s{cursor:pointer}
.tbl th.s[aria-sort]{color:var(--ink)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.tbl td.r,.tbl th.r{text-align:end}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}

/* statement */
.stm-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:14px}
.stm-head .who{display:flex;gap:14px;align-items:center}
.stm-head .who .logo{width:74px;height:auto;flex:none}
.stm-head h2{font-size:24px}
.ctrls{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.ctrls .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrls .row2 input.t{width:auto;flex:1;min-width:140px}

/* charts & bars */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:'Readex Pro',sans-serif}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.hbar.c .tr i{background:var(--brand)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.prod{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.prod.off{opacity:.55}
.sw{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--brand)}

/* sheet */
.ov{position:fixed;inset:0;background:var(--shade);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(580px,100%);max-height:calc(100% - 40px);overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet h3{font-size:21px;margin-bottom:4px}
.sheet .sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.sheet .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:861px){.ov{align-items:center}.sheet{border-radius:24px}}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-grid a{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;font-weight:500}
.more-grid a svg{width:26px;height:26px;color:var(--brand)}
.more-grid a small{color:var(--muted);font-weight:400;font-size:12.5px;margin-top:-4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:80;font-size:14.5px;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
@media (max-width:860px){.toast{bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--muted)}
.loading .logo{width:150px;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.ai-out{white-space:pre-wrap;line-height:1.8;margin-top:12px;font-size:15.5px}
.ai-out:empty{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .side,.topbar,.tabs,.no-print,.toast,.ov{display:none!important}
  :root{padding:0}
  body{background:#fff;color:#000}
  body::before{display:none}
  .app{display:block}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .tbl{font-size:12px}
  .tbl td,.tbl th{padding:5px 6px}
}

/* customer profile */
.phead{display:flex;align-items:center;gap:14px;margin:4px 0 14px;flex-wrap:wrap}
.phead .av{width:58px;height:58px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;flex:none}
.phead h1{font-size:clamp(25px,4.5vw,32px)}
.phead .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pacts .btn{flex:1 1 140px}
.pricecard{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px 14px;align-items:center;font-size:15px}
.pricecard .h{font-size:12.5px;color:var(--muted)}
.pricecard b{font-weight:600}
.tbl tr.mh td{background:var(--surface-2);font-weight:600;color:var(--brand-deep)}
/* prices */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pitem{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.pitem h4{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.pitem h4 small{font-weight:400;font-size:12.5px;color:var(--muted)}
.pitem .two-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pitem .res{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.pitem .res b{font-weight:600}
.matrix{border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:100%}
.matrix th,.matrix td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.matrix th{color:var(--muted);font-weight:500;font-size:13px;text-align:center;position:sticky;top:0;background:var(--surface);z-index:1}
.matrix th small{display:block;font-size:11px;color:var(--brand-deep)}
.matrix td:first-child,.matrix th:first-child{position:sticky;right:0;background:var(--surface);z-index:2;text-align:start;min-width:130px;max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.matrix input.n{width:72px;height:40px;font-size:16px}
.matrix input.n.low{border-color:var(--debt);color:var(--debt)}

.plist .prow b{flex:1;font-weight:600}
.plist .prow input.n{width:100px}

body.locked .side,body.locked .tabs,body.locked .topbar{display:none}

.badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--debt);color:#fff;font-size:12px;align-items:center;justify-content:center;font-weight:600;margin-inline-start:auto}
.tabs a{position:relative}
.tdot{position:absolute;top:9px;left:calc(50% - 17px);width:10px;height:10px;border-radius:50%;background:var(--debt);border:2px solid var(--surface)}
.sgrid,.ptot{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sgrid div,.ptot div{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.sgrid div>span,.ptot div>span{display:block;color:var(--muted);font-size:13px}
.sgrid b{font-size:22px}
.ptot b{font-size:27px;display:block;line-height:1.25}
.ptot small{color:var(--brand-deep);font-size:13px}
.logout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;width:100%}
.logout svg{width:19px;height:19px}
.logout:hover{background:var(--surface-2)}

.sug{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.sug .big small{font-size:16px;font-weight:500}
.sug p{margin:0;flex:1;min-width:220px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow .who{flex:1;min-width:160px}

.mrow .who small{display:block;color:var(--muted);font-size:13px}
.mrow .amt{font-weight:600;font-size:18px;white-space:nowrap}
.mrow .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details.steps{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-top:12px}

details.steps ol{margin:10px 0 0;padding-inline-start:22px;line-height:1.9}
.copyline{display:flex;gap:8px;margin-top:10px}
.copyline input{flex:1;direction:ltr;font-size:13px}

.offline{position:sticky;top:0;z-index:40;background:var(--debt);color:#fff;text-align:center;padding:8px 12px;font-size:14px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:14px;padding:12px 14px;margin-bottom:10px}

.note.done{opacity:.55;background:var(--surface-2)}
.ntag{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--brand-deep);font-weight:600;white-space:nowrap}
.ltable td,.ltable th{text-align:center}
.ltable td:first-child,.ltable th:first-child{text-align:start}
.lsum{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14.5px;margin-top:8px}
.lsum b{font-weight:600}
.lrow{padding:12px 2px;border-bottom:1px solid var(--line)}

.lrow .lh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.lrow .lh b{font-size:16px}

  $('#topbar').innerHTML=`${MARK}<b>${esc(S.settings.name)}</b><div class="sync"></div>`;
  const inMore=(w?W_MORE:MORE).some(m=>m[0]===v);
  $('#tabs').innerHTML=tabs.map(([k,l,i])=>`<a href="#${k}" ${(v===k||(k==='more'&&inMore))?'aria-current="page"':''} ${k==='more'?'data-act="more"':''}>${icon(i)}${l}${k==='live'&&S.unread?'<span class="tdot"></span>':''}</a>`).join('');
  document.title=(S.unread&&!w?`(${S.unread}) `:'')+S.settings.name;
  setSync(S.sync);
}
function setSync(s){S.sync=s;const t={saved:'كل شي محفوظ',saving:'جارٍ الحفظ…',err:'في تعديل ما انحفظ',local:'محفوظ على هذا الجهاز فقط',offline:'محفوظ على الجهاز، بينبعت لما يرجع النت'}[s]||'';
  document.querySelectorAll('.sync').forEach(el=>{el.innerHTML=`<span class="dot ${s==='saving'||s==='offline'?'saving':s==='err'?'err':s==='local'?'local':''}"></span><span class="t">${t}</span>`;el.title=t;});}
function focusLocked(){const a=document.activeElement;return a&&$('#main').contains(a)&&a.matches('input,textarea,select')&&a.type!=='date'&&a.type!=='checkbox';}
function softRender(){if(focusLocked()||$('.ov')){S.pending=true;return;}render();}
function render(){
  S.pending=false;shell();
  let html;
  if(!S.loaded)html=vLoading();
  else if(lockOn()&&!role())html=vLock();
  else if(isW()&&!W_VIEWS.includes(S.view)){S.view='home';html=vHome();}
  else if(!custList().length&&['home','statement'].includes(S.view)&&!isW())html=vEmpty();
  else html=(VIEWS[S.view]||vHome)();
  const ro=S.readonly?`<div class="banner">الصفحة مفتوحة للقراءة فقط، ما بتقدر تعدّل البيانات.</div>`:'';
  document.querySelectorAll('.offline').forEach(x=>x.remove());if(!S.online)$('#main').insertAdjacentHTML('beforebegin',offlineBar());
  $('#main').innerHTML=ro+html;
  if(S.readonly)$('#main').querySelectorAll('input:not([type=date]):not(.search),textarea:not(#ai-in),select.t:not(.nav-sel),.step button').forEach(el=>el.disabled=true);
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending&&!focusLocked()&&!$('.ov'))render();},60));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==S.view&&v!=='entry'&&v!=='customer'){leaveEntry();S.view=v;render();window.scrollTo(0,0);}});
function go(v){leaveEntry();if(v==='entry'||v==='customer'){S.view=v;render();window.scrollTo(0,0);return;}if(location.hash!=='#'+v)location.hash=v;else{S.view=v;render();window.scrollTo(0,0);}}

function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>el.remove(),3200);}
function sheet(html){closeSheet();const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;ov.addEventListener('click',e=>{if(e.target===ov)closeSheet();});document.body.appendChild(ov);setTimeout(()=>{const f=ov.querySelector('[autofocus]');if(f&&matchMedia('(min-width:861px)').matches)f.focus();},40);return ov;}
function closeSheet(){const o=$('.ov');if(o){o.remove();if(S.pending)setTimeout(render,30);}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function confirmSheet(title,sub,okLabel,onOk){const ov=sheet(`<h3>${title}</h3><p class="sub">${sub}</p><div class="acts"><button class="btn pri" id="ok">${okLabel}</button><button class="btn" data-act="close">إلغاء</button></div>`);ov.querySelector('#ok').onclick=()=>{closeSheet();onOk();};}

/* ---------- shared pieces ---------- */
function pageHead(t,sub,acts=''){return `<div class="ph"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div>${acts?`<div class="acts no-print">${acts}</div>`:''}</div>`;}
function L(label,val,cls='',sub=''){return `<div class="${cls}"><span>${label}</span><b>${money(val)}</b>${sub?`<em>${sub}</em>`:''}</div>`;}
function delta(cur,prev){if(!prev)return '';const p=(cur-prev)/Math.abs(prev)*100;if(!isFinite(p))return '';const up=p>=0;return `<span class="${up?'up':'down'}">${up?'▲':'▼'} <span class="num">${Math.abs(p).toFixed(0)}%</span></span> عن نفس الفترة الشهر الماضي`;}
function relDay(d){const n=diffDays(d,today());return n===0?'اليوم':n===1?'مبارح':n===-1?'بكرا':n>1?`قبل ${n} أيام`:`بعد ${-n} أيام`;}
function dateBar(){const isT=S.sel===today();
  return `<div class="datebar no-print"><button class="btn iconbtn" data-act="day-prev" aria-label="اليوم السابق">${icon('back')}</button>
  <label class="dlabel">${icon('cal')}<div><b>${dLong(S.sel)}</b><small>${relDay(S.sel)}</small></div><input type="date" value="${S.sel}" data-act="pick" aria-label="اختر التاريخ"></label>
  <button class="btn iconbtn" data-act="day-next" aria-label="اليوم التالي">${icon('chev')}</button>${isT?'':`<button class="btn" data-act="day-today">اليوم</button>`}</div>`;}
function tagType(c){return `<span class="tag ${c.type}">${TYPES[c.type]||'يومي'}</span>`;}
function custOptions(sel){return custList().map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');}
function chart(from,to){
  const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
  const W=640,H=210,pb=22,n=days.length,bw=W/n,cs=days.map(dayCalc);
  const max=Math.max(1,...cs.map(c=>Math.max(c.sales,c.exp)));const y=v=>(H-pb)*(1-v/max);
  let g='';
  cs.forEach((c,i)=>{const x=W-(i+1)*bw+bw*.16,w=bw*.68;const distH=(H-pb)-y(Math.max(0,c.dist-c.disc)),stH=(H-pb)-y(c.store);const yS=H-pb-stH,yD=yS-distH;
    g+=`<g data-date="${c.date}" data-then="daily" style="cursor:pointer"><title>${esc(dLong(c.date))}: مبيعات ${moneyT(c.sales)}، مصاريف ${moneyT(c.exp)}</title><rect x="${W-(i+1)*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
    if(c.active){g+=`<rect x="${x}" y="${yS}" width="${w}" height="${Math.max(0,stH)}" rx="2" fill="var(--brand)"/><rect x="${x}" y="${yD}" width="${w}" height="${Math.max(0,distH)}" rx="2" fill="var(--pri)"/>`;
      if(c.exp)g+=`<rect x="${x-bw*.08}" y="${y(c.exp)-1.5}" width="${w+bw*.16}" height="3" rx="1.5" fill="var(--debt)"/>`;}
    else g+=`<rect x="${x}" y="${H-pb-2}" width="${w}" height="2" fill="var(--line)"/>`;
    const dn=fromISO(c.date).getDate();if(dn===1||dn%5===0)g+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle">${dn}</text>`;g+='</g>';});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="المبيعات والمصاريف اليومية">${g}</svg>`;
}

/* ---------- views ---------- */
function vLoading(){return `<div class="loading">${LOGO}<div>جارٍ تحميل الدفتر…</div>${S.slow?'<div class="hint">البيانات بتتأخر. تأكد إنك متصل بالإنترنت.</div>':''}</div>`;}
function vEmpty(){return `<div class="empty">${LOGO}<h2>أهلاً بـ${esc(S.settings.name)}</h2><p>الدفتر فاضي. ابدأ بإضافة الزبائن وأسعارهم، وبعدها سجّل التوزيع كل يوم.<br>باقي الصفحات مفتوحة لتشوف شكلها.</p><div class="chips" style="justify-content:center;margin-top:18px"><button class="btn pri" data-act="new-cust">${icon('plus')}أضف أول زبون</button><a class="btn" href="#setup">استرجاع نسخة احتياطية</a></div></div>`;}

  const t=S.sel,c=dayCalc(t),mk=mKey(t),mc=rangeCalc(mk+'-01',t);const B=balances();const cl=custList();
  const active=cl.filter(x=>x.active).length;const totalDebt=cl.reduce((a,x)=>a+Math.max(0,B[x.id]?.bal||0),0);
  const lastActive=[...memo().dates].reverse().find(d=>dayCalc(d).active);
  const note=(!c.active&&lastActive&&lastActive!==t)?`<div class="banner">ما في تسجيل لهاليوم. آخر يوم مسجّل: ${dLong(lastActive)}.<span style="flex:1"></span><button class="btn sm" data-date="${lastActive}">اعرضه</button></div>`:'';
  if(isW())return vWorkerHome();
  const tile=(act,ic,title,sub,cls='')=>`<button class="tile" ${act}><span class="ic">${icon(ic)}</span><b>${title}</b><small class="${cls}">${sub}</small></button>`;
  return `${dateBar()}${note}
  <section class="card today"><div class="tnet"><span>صافي ربح ${t===today()?'اليوم':'هاليوم'}</span><b>${money(c.net)}</b><small>صافي النقد ${moneyT(c.cash)}</small></div>
  <div class="tgrid"><div><span>المبيعات</span><b>${money(c.sales)}</b></div><div><span>المصاريف</span><b>${money(c.exp)}</b></div><div><span>المقبوض</span><b>${money(c.recv)}</b></div><div><span>ديون اليوم</span><b class="${c.debt>0.009?'d':''}">${money(c.debt)}</b></div></div></section>
  <div class="tiles">
    ${tile('data-go="dist"','dist','التوزيع',c.count?`سجّلت ${c.count} من ${active} زبون`:'لسا ما بلشت',c.count>=active&&active?'ok':'')}
    ${tile('data-go="daily"','daily','الإنتاج والمصاريف',c.hasOps?'انسجّل ✓':'لسا ما انسجّل',c.hasOps?'ok':c.count?'warn':'')}
    ${tile('data-act="pay"','pay','تسجيل دفعة',totalDebt>0.009?`الديون كلها ${moneyT(totalDebt)}`:'ما في ديون')}
    ${tile('data-go="live"','live','المباشر',feedItems(today()).length?`${feedItems(today()).length} حركة اليوم`:'لسا ما صار شي اليوم')}
  </div>
  <div class="two">
    <section class="card"><div class="ch"><h3>شو صار اليوم</h3><a class="btn sm" href="#live">كل المباشر</a></div>${feedList(feedItems(today()).slice(0,5))||'<p class="hint" style="margin:0">لسا ما حدا سجّل شي اليوم.</p>'}</section>
    <section class="card"><div class="ch"><h3>ملاحظات للعمال</h3><button class="btn sm pri" data-act="note-new">${icon('plus')}ملاحظة</button></div>${notesAdminList()}</section>
    <section class="card"><h3>بدها انتباه</h3>${alertsBlock()}</section>
    <section class="card"><div class="ch"><h3>${mName(mk)}</h3><a class="btn sm" href="#reports">التقرير الكامل</a></div>
      <div class="mini"><div><span>المبيعات</span><b>${money(mc.sales)}</b></div><div><span>المصاريف</span><b>${money(mc.exp)}</b></div><div><span>صافي الربح</span><b>${money(mc.net)}</b></div></div>
      <p class="hint" style="margin-bottom:0">من أول الشهر لحد ${dShort(t)}، ${mc.days} يوم عمل.</p></section>
    <section class="card"><div class="ch"><h3>الموجود بالمخبز</h3><a class="btn sm" href="#stock">تحديث</a></div>${S.stock.at?`<p class="hint" style="margin-top:-4px">${esc(S.stock.who||'')}، ${timeAgo(S.stock.at)}</p>${stockGrid(S.stock.q)}`:'<p class="hint" style="margin:0">لسا ما حدا كتب الموجود.</p>'}</section>
  </div>`;
}
function alertsBlock(){
  const items=[];const B=balances();const t=today();
  for(let i=0;i<10;i++){const d=addDays(t,-i);const c=dayCalc(d);
    if(c.count>0&&!c.hasOps)items.push({k:'y',t:`${dLong(d)}: الإنتاج والمصاريف ناقصين`,s:'الربح مش دقيق لهاليوم',act:`data-date="${d}" data-then="daily"`});
    else if(c.count>0&&!c.store)items.push({k:'y',t:`${dLong(d)}: مبيعات المحل فاضية`,s:'اكتب مبلغ مبيعات المحل',act:`data-date="${d}" data-then="daily"`});}
  const od=custList().filter(c=>overdue(c,B[c.id])).sort((a,b)=>B[b.id].bal-B[a.id].bal);
  od.slice(0,5).forEach(c=>{const b=B[c.id];const age=b.since?diffDays(b.since,t):null;items.push({k:'r',t:`${esc(c.name)} متأخر بالدفع`,s:`${TYPES[c.type]}${age!=null?`، الدين من ${age} يوم`:''}`,v:money(b.bal),act:`data-act="stmt" data-cid="${c.id}"`});});
  if(od.length>5)items.push({k:'r',t:`و${od.length-5} زبائن متأخرين كمان`,s:'شوف صفحة الديون',act:'data-go="debts"'});
  if(!items.length)return `<div class="allgood">${icon('check')}كل شي مرتب، ما في شي ناقص أو متأخر.</div>`;
  return `<div class="alist">${items.slice(0,8).map(x=>`<button class="aitem" ${x.act}><span class="mk ${x.k==='r'?'r':''}"></span><div><b>${x.t}</b><small>${x.s}</small></div>${x.v?`<span class="v">${x.v}</span>`:''}</button>`).join('')}</div>`;
}

/* distribution: list */
function distFiltered(){const E=(S.days[S.sel]||{}).e||{};const q=S.dq.trim();
  return custList().filter(c=>{const e=E[c.id];if(!c.active&&entryEmpty(e))return false;if(q&&!String(c.name).includes(q))return false;
    if(S.df==='filled'&&entryEmpty(e))return false;if(S.df==='empty'&&!entryEmpty(e))return false;if(S.df==='debt'&&!(entryDebt(e)>0.009))return false;return true;});}
function vDist(){
  const c=dayCalc(S.sel);const active=custList().filter(x=>x.active||!entryEmpty(S.days[S.sel]?.e?.[x.id])).length;

}
function qtySummary(e){return PRODUCTS.filter(p=>num(e?.q?.[p.k])).map(p=>`${p.n} ${fmt(e.q[p.k])}`).join('، ');}
function distRows(){const E=(S.days[S.sel]||{}).e||{};const l=distFiltered();

/* distribution: one customer */

  ${rets?`<section class="card"><h3>المرتجع</h3>${rets}</section>`:''}
  <section class="card"><h3>الدفع</h3>
    <div class="payrow"><input class="n" inputmode="decimal" data-f="paid" value="${v(e?.paid)}" placeholder="المبلغ المدفوع" autocomplete="off" aria-label="المدفوع"><button class="btn pri" data-act="full">دفع كامل</button><button class="btn" data-act="nopay">ما دفع</button></div>
    <div class="calc3"><div><span>المبلغ</span><b data-o="amt">${fmt(entryAmt(e))}</b></div><div><span>المدفوع</span><b data-o="paid">${fmt(num(e?.paid))}</b></div><div><span>الباقي</span><b data-o="debt" class="${entryDebt(e)>0.009?'d':''}">${fmt(entryDebt(e))}</b></div></div>
    <button class="linkbtn" data-act="eopts" aria-expanded="${!!showExtra}">${isW()?'ملاحظة':'خصم أو ملاحظة'}</button>

function entryFor(date,cid){const ex=S.days[date]?.e?.[cid];const c=S.customers[cid];if(entryEmpty(ex)){const b=blankEntry(c);if(ex&&ex.note)b.note=ex.note;return b;}return fullEntry(ex);}
function blankEntry(c){const e={q:{},pr:{},rb:0,rl:0,paid:0,disc:0,note:'',amt:null};PRODUCTS.forEach(p=>{e.q[p.k]=0;e.pr[p.k]=c?.prices?.[p.k]??null;});return e;}

/* customer profile */
function custProfile(cid){
  const Lg=ledger(cid);const rows=Lg.rows;const T={amt:0,paid:0,disc:0,q:{},rb:0,rl:0,cost:0,costKnown:true};PRODUCTS.forEach(p=>T.q[p.k]=0);
  const months={};const pc=S.settings.pc||{};
  rows.forEach(r=>{const mk=mKey(r.date);const m=months[mk]||(months[mk]={mk,days:0,amt:0,paid:0,disc:0,q:{}});m.days++;m.amt+=r.amt;m.paid+=r.paid;m.disc+=r.disc;
    T.amt+=r.amt;T.paid+=r.paid;T.disc+=r.disc;T.rb+=num(r.e.rb);T.rl+=num(r.e.rl);
    PRODUCTS.forEach(p=>{const q=num(r.e.q?.[p.k]);if(!q)return;T.q[p.k]+=q;m.q[p.k]=(m.q[p.k]||0)+q;const c=num(pc[p.k]?.cost);if(c)T.cost+=q*c;else T.costKnown=false;});
    const net=num(r.e.rb)*num(pc.b?.cost)+num(r.e.rl)*num(pc.l?.cost);T.cost-=net;});
  const dealt=rows.filter(r=>r.amt>0);
  return {Lg,rows,T,months:Object.values(months).sort((a,b)=>b.mk.localeCompare(a.mk)),first:dealt[0]?.date,last:dealt[dealt.length-1]?.date,pays:rows.filter(r=>r.paid>0).reverse(),dealtDays:dealt.length};
}
function vCustomer(){
  const c=S.customers[S.cc];if(!c){S.view='customers';return vCustomers();}
  const P=custProfile(c.id),T=P.T,b=balances()[c.id]||{bal:0};const pc=S.settings.pc||{};
  const age=b.since?diffDays(b.since,today()):null;const late=overdue(c,b);

function costRes(k){const pc=S.settings.pc||{};const co=num(pc[k]?.cost),pr=num(pc[k]?.price);const a=avgPrice(k);

function priceBody(){const pc=S.settings.pc||{};const q=(S.pq||'').trim();const pv=S.pv||'all';

  const cell=(c,k)=>{const pr=c.allow?.[k]?num(c.prices?.[k]):0;const co=num(pc[k]?.cost);return `<input class="n ${pr&&co&&pr<co?'low':''}" inputmode="decimal" data-mp="${c.id}" data-k="${k}" value="${pr?String(pr):''}" placeholder="—" aria-label="${esc(c.name)} ${PN[k]}">`;};

async function hashPin(pin){const txt='yunes-bakery:'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=5381;for(const ch of txt)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'f'+h.toString(16);}}

async function doLogin(){const r=S.lr||'worker';const pin=($('#lk-pin')?.value||'').trim();const name=($('#lk-name')?.value||'').trim();
  if(r==='worker'&&!name){toast('اكتب اسمك');return;}if(!pin){toast('اكتب كلمة السر');return;}
  if(S.mode==='fb'){if(!Store.auth){toast(S.fbErr||'إعدادات Firebase ناقصة');return;}const FB=window.BAKERY_FIREBASE;const email=r==='admin'?FB.adminEmail:FB.workerEmail;
    S.sess={role:r,name:r==='admin'?(S.settings.adminName||'يوسف'):name};try{localStorage.setItem('bakery-role',JSON.stringify(S.sess));if(r==='worker')localStorage.setItem('bakery-wname',name);}catch(e){}
    try{await Store.auth.signInWithEmailAndPassword(email,pin);S.view='home';toast('أهلاً '+S.sess.name);}catch(e){toast(e&&e.code==='auth/network-request-failed'?'ما في إنترنت':'كلمة السر غلط');}return;}
  const h=await hashPin(pin);const p=S.settings.pins||{};if(!p[r]||p[r]!==h){toast('كلمة السر غلط');return;}
  S.sess={role:r,h,name:r==='admin'?(S.settings.adminName||'يوسف'):name};try{localStorage.setItem('bakery-role',JSON.stringify(S.sess));if(r==='worker')localStorage.setItem('bakery-wname',name);}catch(e){}
  S.view='home';render();toast('أهلاً '+S.sess.name);}

function hhmm(t){const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());}
function timeAgo(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return 'هلأ';if(m<60)return `قبل ${m} دقيقة`;const h=Math.round(m/60);if(h<24)return `قبل ${h===1?'ساعة':h===2?'ساعتين':h+' ساعات'}`;const d=new Date(t);return `${d.getDate()}/${d.getMonth()+1} الساعة ${hhmm(t)}`;}

function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=beep.c||(beep.c=new A());const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.15,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.4);}catch(e){}}
function newEvents(prev,items){const fresh=Object.entries(items).filter(([id,x])=>!prev[id]&&x&&x.dev!==DEV).map(([,x])=>x).sort((a,b)=>a.t-b.t);if(!fresh.length||isW())return;

const sumQ=q=>PRODUCTS.reduce((a,p)=>a+num(q?.[p.k]),0);
const qText=q=>PRODUCTS.filter(p=>num(q?.[p.k])).map(p=>`${p.n} ${fmt(q[p.k])}`).join('، ')||'ولا شي';
function loadsOn(d){return Object.entries(S.days[d]?.loads||{}).filter(([,x])=>x&&x.t).map(([id,x])=>({id,...x})).sort((a,b)=>a.t-b.t);}
function myOpenLoad(d){return loadsOn(d).find(x=>x.dev===DEV&&!x.closed);}
function loadCalc(d,L){const E=S.days[d]?.e||{};const r={q:{},rb:0,rl:0,paid:0,shops:0,exp:{}};PRODUCTS.forEach(p=>r.q[p.k]=0);
  for(const cid in E){const e=E[cid];if(entryEmpty(e)||e.lid!==L.id)continue;r.shops++;PRODUCTS.forEach(p=>r.q[p.k]+=num(e.q?.[p.k]));r.rb+=num(e.rb);r.rl+=num(e.rl);r.paid+=num(e.paid);}
  PRODUCTS.forEach(p=>{r.exp[p.k]=r2(num(L.q?.[p.k])-r.q[p.k]+(p.k==='b'?r.rb:p.k==='l'?r.rl:0));});return r;}
function loadRow(d,L){const r=loadCalc(d,L);

  ${miss>0.01?`<div class="hint" style="margin:6px 0 0">الناقص: ${qText(L.missing)}</div>`:''}${L.note?`<div class="hint" style="margin:6px 0 0">${esc(L.note)}</div>`:''}</div>`;}
function vLoad(){const d=S.sel;const OL=myOpenLoad(d);const w=isW();

/* ---------- flour ---------- */
function flourBuys(){return Object.entries(S.flour.buys||{}).filter(([,x])=>x&&x.date).map(([id,x])=>({id,...x})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));}
function batchesOn(d){const o=S.days[d]?.ops||{};return num(o.bb)+num(o.lb)+num(o.gb)+num(o.tb);}
function bpbInfo(){const st=S.settings;if(num(st.bpb))return {bpb:num(st.bpb),src:'set'};const lp=[...flourBuys()].reverse().find(x=>num(x.price));if(lp&&num(st.flour))return {bpb:num(lp.price)/num(st.flour),src:'price'};return {bpb:0,src:''};}
function flourState(){const m=memo();if(m.flour)return m.flour;const I=bpbInfo();const buys=flourBuys();const t=today();
  const start=S.settings.flourFrom||buys[0]?.date||m.dates[0]||t;const open=num(S.settings.flourOpen);
  let bought=0;buys.forEach(b=>{if(b.date>=start&&b.date<=t)bought+=num(b.bags);});
  let batches=0;for(const d of m.dates){if(d>=start&&d<=t)batches+=batchesOn(d);}
  const used=I.bpb?batches/I.bpb:null;const stock=used==null||(!buys.length&&!open)?null:open+bought-used;
  let b14=0,act=0;for(let i=1;i<=14;i++){const b=batchesOn(addDays(t,-i));b14+=b;if(b)act++;}
  const daily=I.bpb&&act?b14/14/I.bpb:null;const daysLeft=daily&&stock!=null?stock/daily:null;
  const last=buys[buys.length-1],prev=buys[buys.length-2];let cycle=7;if(last&&prev){const c=diffDays(prev.date,last.date);if(c>=2&&c<=31)cycle=c;}
  const suggest=daily!=null&&stock!=null?Math.max(0,Math.ceil(daily*cycle*1.1-Math.max(0,stock))):daily!=null?Math.ceil(daily*cycle*1.1):null;
  let enough=null;if(prev&&last&&I.bpb){let bb=0;for(let d=prev.date;d<last.date;d=addDays(d,1))bb+=batchesOn(d);enough={used:bb/I.bpb,bought:num(prev.bags),days:diffDays(prev.date,last.date)};enough.ok=enough.used<=enough.bought+0.01;}
  const period=(from)=>{let b=0,money=0,bt=0;buys.forEach(x=>{if(x.date>=from&&x.date<=t){b+=num(x.bags);money+=num(x.bags)*num(x.price);}});for(const d of m.dates){if(d>=from&&d<=t)bt+=batchesOn(d);}return {bought:b,money,used:I.bpb?bt/I.bpb:null,batches:bt};};
  const wk=addDays(t,-fromISO(t).getDay());
  return m.flour={I,buys,start,open,bought,used,stock,daily,daysLeft,cycle,suggest,last,prev,enough,week:period(wk),month:period(mKey(t)+'-01')};}
function vFlour(){const F=flourState();const w=isW();const r1=x=>fmt(Math.round(x*10)/10);

/* statement */
function stmtRange(){const t=today();
  if(S.sp==='week')return [addDays(t,-6),t];if(S.sp==='month')return [mKey(t)+'-01',t];
  if(S.sp==='last'){const p=mPrev(mKey(t));return [p+'-01',mEnd(p)];}
  if(S.sp==='custom')return [S.sf||mKey(t)+'-01',S.sto||t];
  const Lg=ledger(S.sc);let start=null,prev=Lg.open;
  for(const r of Lg.rows){if(prev<=0.009&&r.bal>0.009)start=r.date;if(r.bal<=0.009)start=null;prev=r.bal;}
  if(start===null&&Lg.open>0.009&&Lg.rows.every(r=>r.bal>0.009))start=Lg.rows[0]?.date||t;
  return start?[start,t]:[mKey(t)+'-01',t];}
function statement(cid,from,to){const Lg=ledger(cid);let open=Lg.open;const rows=[];
  for(const r of Lg.rows){if(r.date<from)open=r.bal;else if(r.date<=to)rows.push(r);}
  const T={amt:0,paid:0,disc:0,q:{},rb:0,rl:0};PRODUCTS.forEach(p=>T.q[p.k]=0);
  rows.forEach(r=>{T.amt+=r.amt;T.paid+=r.paid;T.disc+=r.disc;PRODUCTS.forEach(p=>T.q[p.k]+=num(r.e.q?.[p.k]));T.rb+=num(r.e.rb);T.rl+=num(r.e.rl);});
  const close=rows.length?rows[rows.length-1].bal:open;return {open,rows,T,close,from,to};}

function stmtText(){const c=S.customers[S.sc];const[from,to]=stmtRange();const st=statement(S.sc,from,to);

function monthsAvail(){const s=new Set(memo().dates.map(mKey));s.add(mKey(today()));return [...s].sort().reverse();}
function monthData(mk){const from=mk+'-01',end=mEnd(mk),to=end>today()?today():end;const t=rangeCalc(from,end);
  const per={};for(const d of memo().dates){if(d<from||d>end)continue;const E=S.days[d].e||{};for(const cid in E){const e=E[cid];if(entryEmpty(e))continue;const p=per[cid]||(per[cid]={sales:0,disc:0,paid:0,q:0,days:0});p.sales+=entryAmt(e);p.disc+=num(e.disc);p.paid+=num(e.paid);p.q+=PRODUCTS.reduce((a,x)=>a+num(e.q?.[x.k]),0);p.days++;}}
  for(const k in per){per[k].debt=per[k].sales-per[k].disc-per[k].paid;}
  t.remaining=Object.values(per).reduce((a,p)=>a+Math.max(0,p.debt),0);
  return {mk,from,to,end,t,per};}

async function askAI(question){
  const out=$('#ai-out');if(!out)return;question=(question||'').trim();if(!question){toast('اكتب سؤالك');return;}
  let sample=null;try{sample=await window.claude?.use?.('sample');}catch(e){}
  if(!sample){out.textContent='المساعد مش متاح بهالنسخة من الصفحة.';return;}
  const M=monthData(S.rm),t=M.t;const days=[];for(let d=M.from;d<=M.end;d=addDays(d,1)){const c=dayCalc(d);if(c.active)days.push({d:c.date,sales:r2(c.sales),dist:r2(c.dist-c.disc),store:c.store,exp:r2(c.exp),net:r2(c.net),bread:c.q.b,lahm:c.q.l,workers:c.workers});}
  const B=balances();const cust=custList().filter(c=>M.per[c.id]||(B[c.id]?.bal||0)>0.009).map(c=>({name:c.name,type:TYPES[c.type],month:M.per[c.id]?{sales:r2(M.per[c.id].sales-M.per[c.id].disc),paid:r2(M.per[c.id].paid),qty:M.per[c.id].q}:null,balance:r2(B[c.id]?.bal||0),debtSince:B[c.id]?.since||null}));
  const summary={month:mName(S.rm),currency:S.settings.cur,totals:Object.fromEntries(SUMK.map(k=>[k,r2(t[k])])),products:t.q,remainingDebts:r2(t.remaining)};
  const prompt=`أنت مستشار مالي لمخبز اسمه "${S.settings.name}". هذه بيانات حقيقية من دفتر المخبز لشهر ${mName(S.rm)}.\nالمفاتيح: dist مبيعات التوزيع، store مبيعات المحل، exp المصاريف، net صافي الربح، flour الطحين، mat المواد، workers العمال، disc الخصومات، paid المقبوض من التوزيع.\n\nالملخص: ${JSON.stringify(summary)}\nالأيام: ${JSON.stringify(days)}\nالزبائن (balance = الرصيد التراكمي الحالي): ${JSON.stringify(cust)}\n\nالسؤال: ${question}\n\nجاوب باللهجة الفلسطينية البسيطة، باختصار (حتى 8 أسطر)، واعتمد فقط على الأرقام الموجودة. لا تستعمل جداول ولا تنسيق ماركداون، اكتب نص عادي مع أرقام واضحة.`;
  out.textContent='بفكّر…';const btns=document.querySelectorAll('[data-act=ai],[data-act=ai-q]');btns.forEach(b=>b.disabled=true);
  try{const {text}=await sample(prompt,{onText:({text})=>{out.textContent=text;}});out.textContent=text;}
  catch(e){out.textContent=e&&e.code==='not_granted'?'المساعد مش مسموح. بتقدر تسمح له من إعدادات الصفحة.':e&&e.code==='rate_limited'?'في طلبات كثير، جرّب بعد دقيقة.':((e&&e.text)||'ما قدرت أجاوب هلأ، جرّب كمان مرة.');}
  finally{btns.forEach(b=>b.disabled=false);}
}

async function saveFile(filename,data){let dl=null;try{dl=await window.claude?.use?.('downloads');}catch(e){}

  try{await dl.save({filename,data});}catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'استنى شوي وجرّب':'ما زبط التنزيل');}}
function xlsBook(sheets){if(!window.XLSX){toast('مكتبة Excel ما تحمّلت، تأكد من الإنترنت');return null;}
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  for(const [name,aoa] of sheets){const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=aoa[0].map((_,i)=>({wch:Math.min(28,Math.max(8,...aoa.slice(0,60).map(r=>String(r[i]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));}
  return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]);}
function movementRows(from,to){const head=['التاريخ','رقم الزبون','اسم الزبون','نوع الحساب',...PRODUCTS.map(p=>p.n),'مرتجع خبز','مرتجع لحمنيوت','المجموع','المدفوع','خصم / هامش','الدين','الحالة','ملاحظات'];const out=[head];
  for(const d of memo().dates){if(d<from||d>to)continue;const E=S.days[d].e||{};for(const c of custList()){const e=E[c.id];if(entryEmpty(e))continue;out.push([d,c.code,c.name,TYPES[c.type],...PRODUCTS.map(p=>num(e.q?.[p.k])||''),num(e.rb)||'',num(e.rl)||'',entryAmt(e),num(e.paid),num(e.disc)||'',entryDebt(e),ST[entryStatus(e)]||'',e.note||'']);}}return out;}
function opsRows(from,to){const out=[['التاريخ',...BATCH.map(x=>x[1]),'تكلفة الطحين','تكلفة المواد',...EXP.map(x=>x[1]),'مبيعات المحل','مبيعات التوزيع','إجمالي المصاريف','إجمالي المبيعات','إجمالي المقبوض','ديون التوزيع','صافي الربح','صافي النقد','ملاحظات']];
  for(const d of memo().dates){if(d<from||d>to)continue;const c=dayCalc(d);if(!c.active)continue;const o=S.days[d].ops||{};out.push([d,...BATCH.map(x=>num(o[x[0]])||''),c.flour,c.mat,...EXP.map(x=>c[x[0]]||''),c.store,r2(c.dist-c.disc),c.exp,c.sales,c.recv,c.debt,c.net,c.cash,o.note||'']);}return out;}
async function exportMonth(){const M=monthData(S.rm),t=M.t;
  const sum=[['ملخص '+mName(S.rm),''],['إجمالي المبيعات',t.sales],['المقبوض',t.recv],['الديون المتبقية',r2(t.remaining)],['إجمالي المصاريف',t.exp],['مبيعات داخل المحل',t.store],['صافي الربح',t.net],['صافي النقد',t.cash],['خصم / هامش',t.disc],['',''],...PRODUCTS.map(p=>[p.n+' خارج',t.q[p.k]]),['مرتجع الخبز',t.rb],['مرتجع اللحمنيوت',t.rl]];
  const cust=[['رقم الزبون','اسم الزبون','نوع الحساب','مبيعات التوزيع','مدفوع التوزيع','دين التوزيع','الحالة'],...custList().map(c=>{const p=M.per[c.id];if(!p)return null;return [c.code,c.name,TYPES[c.type],r2(p.sales-p.disc),r2(p.paid),r2(p.debt),p.debt>0.009?(p.paid>0?'مدفوع جزئي':'غير مدفوع'):'مسدد'];}).filter(Boolean)];
  const b=xlsBook([['الملخص الشهري',sum],['الحركة اليومية',movementRows(M.from,M.end)],['التشغيل والمصاريف',opsRows(M.from,M.end)],['الزبائن',cust]]);if(b)await saveFile(`المخبز - ${mName(S.rm)}.xlsx`,b);}
async function exportAll(){const dates=memo().dates;if(!dates.length){toast('ما في بيانات');return;}const from=dates[0],to=dates[dates.length-1];
  const cust=[['رقم الزبون','اسم الزبون','نوع الحساب',...PRODUCTS.map(p=>'سعر '+p.n),'الهاتف','الرصيد','نشط','ملاحظات'],...custList().map(c=>[c.code,c.name,TYPES[c.type],...PRODUCTS.map(p=>c.allow?.[p.k]?(num(c.prices?.[p.k])||''):''),c.phone||'',r2(balances()[c.id]?.bal||0),c.active?'نعم':'لا',c.note||''])];
  const b=xlsBook([['الزبائن',cust],['الحركة اليومية',movementRows(from,to)],['التشغيل والمصاريف',opsRows(from,to)]]);if(b)await saveFile(`دفتر المخبز - ${today()}.xlsx`,b);}
async function exportStmt(){const c=S.customers[S.sc];const[from,to]=stmtRange();const st=statement(S.sc,from,to);
  const head=['التاريخ',...PRODUCTS.map(p=>p.n),'مرتجع خبز','مرتجع لحمنيوت','المبلغ','المدفوع','خصم / هامش','الرصيد','ملاحظات'];
  const aoa=[['كشف حساب '+c.name+' — من '+from+' إلى '+to],[],head,['رصيد سابق',...PRODUCTS.map(()=>''),'','','','','',st.open,''],...st.rows.map(r=>[r.date,...PRODUCTS.map(p=>num(r.e.q?.[p.k])||''),num(r.e.rb)||'',num(r.e.rl)||'',r.amt,r.paid||'',r.disc||'',r.bal,r.e.note||'']),['المجموع',...PRODUCTS.map(p=>st.T.q[p.k]||''),st.T.rb||'',st.T.rl||'',st.T.amt,st.T.paid,st.T.disc||'',st.close,'']];
  const b=xlsBook([['كشف حساب',aoa]]);if(b)await saveFile(`كشف حساب ${c.name}.xlsx`,b);}
async function backup(){await saveFile(`نسخة احتياطية - المخبز - ${today()}.json`,JSON.stringify({app:'bakery-ledger',version:1,exported:new Date().toISOString(),settings:S.settings,customers:S.customers,days:S.days,flour:S.flour}));}
function restore(file){const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result);}catch(e){toast('الملف مش نسخة احتياطية صالحة');return;}
  if(!j||!j.customers||!j.days){toast('الملف مش نسخة احتياطية صالحة');return;}
  confirmSheet('استرجاع النسخة الاحتياطية',`فيها ${Object.keys(j.customers).length} زبون و${Object.keys(j.days).length} يوم. رح تندمج مع البيانات الحالية، والأيام اللي بنفس التاريخ بتنكتب فوقها.`,'استرجع',async()=>{
    toast('جارٍ الاسترجاع…');patchDoc('bakery/settings',j.settings||{},0);patchDoc('bakery/customers',{list:j.customers},0);if(j.flour)patchDoc('bakery/flour',j.flour,0);
    for(const d in j.days){patchDoc('days/'+d,j.days[d],0);if(S.mode==='db')await sleep(120);}render();toast('تم الاسترجاع');});};r.readAsText(file);}

/* ---------- events ---------- */
function selectDate(d,then){if(!d)return;S.sel=d;if(then&&then!==S.view){go(then);return;}render();}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act],[data-go],[data-date]');if(!a)return;
  const act=a.dataset.act;
  if(a.dataset.go){e.preventDefault();closeSheet();go(a.dataset.go);return;}
  if(a.dataset.date&&!act){closeSheet();selectDate(a.dataset.date,a.dataset.then);return;}
  const box=a.closest('[data-entry]');
  switch(act){
    case 'more':e.preventDefault();sheet(`<h3>المزيد</h3><p class="sub">باقي أقسام الدفتر</p><div class="more-grid">${(isW()?W_MORE:MORE).map(([v,l,i,s])=>`<a href="#${v}" data-go="${v}">${icon(i)}${l}<small>${s}</small></a>`).join('')}</div><div class="acts"><button class="btn" data-act="close">إغلاق</button></div>`);break;
    case 'close':closeSheet();break;
    case 'day-prev':selectDate(addDays(S.sel,-1));break;
    case 'day-next':selectDate(addDays(S.sel,1));break;
    case 'day-today':selectDate(today());break;
    case 'df':S.df=a.dataset.v;render();break;
    case 'ct':S.ct=a.dataset.v;render();break;
    case 'cinact':S.cInactive=!S.cInactive;render();break;
    case 'bt':S.bt=a.dataset.v;render();break;
    case 'sp':S.sp=a.dataset.v;if(S.sp==='custom'&&!S.sf){S.sf=mKey(today())+'-01';S.sto=today();}render();break;
    case 'rsort':S.rsort=a.dataset.v;render();break;
    case 'open':openEntry(a.dataset.cid);break;
    case 'back':go('dist');break;
    case 'eprev':entryStep(-1);break;
    case 'enext':entryStep(1);break;
    case 'lr':S.lr=a.dataset.v;render();break;
    case 'login':doLogin();break;
    case 'logout':closeSheet();leaveEntry();if(S.mode==='fb'&&Store.auth)Store.auth.signOut();S.sess=null;try{localStorage.removeItem('bakery-role');}catch(err){}S.view='home';render();break;
    case 'save-pins':savePins();break;
    case 'clear-pins':confirmSheet('شيل القفل','رح تنشال كلمات السر، وأي حدا بيفتح الصفحة بيشوف كل شي.','شيل القفل',()=>{patchDoc('bakery/settings',{pins:{admin:null,worker:null}},50);render();toast('انشال القفل');});break;
    case 'ld':S.ld=a.dataset.v==='today'?today():addDays(today(),-1);render();break;
    case 'sinc':case 'sdec':{const k=a.dataset.k;const q=S.sdraft||(S.sdraft=clone(S.stock.q||{}));q[k]=Math.max(0,num(q[k])+(act==='sinc'?1:-1));const i=document.querySelector(`[data-sk="${k}"]`);if(i)i.value=q[k]?String(q[k]):'';stockTot();break;}
    case 'stock-send':sendStock();break;
    case 'note-new':noteSheet(a.dataset.cid);break;
    case 'note-done':{const n=S.notes.items?.[a.dataset.id];if(!n)break;patchDoc('bakery/notes',{items:{[a.dataset.id]:{done:true,doneBy:me(),doneAt:Date.now()}}},50);logEvent('note',`شاف الملاحظة: ${n.text}${n.cid&&S.customers[n.cid]?` (${S.customers[n.cid].name})`:''}`);render();toast('تمام ✓');break;}
    case 'note-del':patchDoc('bakery/notes',{items:{[a.dataset.id]:null}},50);render();break;
    case 'lqinc':case 'lqdec':{const k=a.dataset.k;const q=S.ldraft||(S.ldraft={});q[k]=Math.max(0,num(q[k])+(act==='lqinc'?10:-10));const i=document.querySelector(`[data-lq="${k}"]`);if(i)i.value=q[k]?String(q[k]):'';break;}
    case 'load-start':startLoad();break;
    case 'load-add':loadAddSheet(a.dataset.id);break;
    case 'load-close':loadCloseSheet(a.dataset.id);break;
    case 'flour-add':addFlour();break;
    case 'flour-del':confirmSheet('حذف الشراء','رح ينحذف هالسطر من مشتريات الطحين.','احذف',()=>{patchDoc('bakery/flour',{buys:{[a.dataset.id]:null}},50);render();});break;
    case 'copy-url':{const i=$('#rem-url');if(i){i.select();const done=()=>toast('انسخ الرابط');if(navigator.clipboard)navigator.clipboard.writeText(i.value).then(done,()=>{document.execCommand('copy');done();});else{document.execCommand('copy');done();}}break;}
    case 'inc':case 'dec':{if(!box||S.readonly)break;const f=a.dataset.f;const inp=box.querySelector(`input[data-f="${f}"]`);const nv=Math.max(0,r2(num(inp.value)+(act==='inc'?1:-1)));inp.value=nv?String(nv):'';setField(box.dataset.entry,f,nv);break;}
    case 'full':{if(!box||S.readonly)break;const cid=box.dataset.entry;const en=entryFor(S.sel,cid);const pv=Math.max(0,r2(entryAmt(en)-num(en.disc)));box.querySelector('[data-f=paid]').value=pv?String(pv):'';setField(cid,'paid',pv);break;}
    case 'nopay':{if(!box||S.readonly)break;box.querySelector('[data-f=paid]').value='';setField(box.dataset.entry,'paid',0);break;}
    case 'eopts':{const x=box.querySelector('.extra');x.hidden=!x.hidden;a.setAttribute('aria-expanded',String(!x.hidden));break;}
    case 'copy-prev':copyPrev();break;
    case 'pay':closeSheet();paySheet(a.dataset.cid);break;
    case 'stmt':closeSheet();if(a.dataset.cid)S.sc=a.dataset.cid;if(a.dataset.sp&&a.dataset.sp.startsWith('month:')){const mk=a.dataset.sp.slice(6);S.sp='custom';S.sf=mk+'-01';S.sto=mEnd(mk);}else S.sp='open';go('statement');break;
    case 'new-cust':if(S.view!=='customers')go('customers');custSheet(null);break;
    case 'edit-cust':custSheet(a.dataset.cid);break;
    case 'cust-view':closeSheet();S.cc=a.dataset.cid;go('customer');break;
    case 'cust-back':go('customers');break;
    case 'cust-dist':S.sel=today();openEntry(a.dataset.cid);break;
    case 'pv':S.pv=a.dataset.v;render();break;
    case 'xls-prices':exportPrices();break;
    case 'print':try{window.print();}catch(err){toast('الطباعة مش متاحة هون');}break;
    case 'wa':{const c=S.customers[S.sc];const txt=stmtText();const url='https://wa.me/'+(c.phone||'')+'?text='+encodeURIComponent(txt);
      const ov=sheet(`<h3>إرسال الكشف على واتساب</h3><p class="sub">${c.phone?'رح يفتح محادثة '+esc(c.name)+' مع نص الكشف.':'ما في رقم لهالزبون. بتقدر تختار المحادثة بنفسك، أو تضيف الرقم من صفحة الزبائن.'}</p><textarea class="t" readonly style="min-height:200px">${esc(txt)}</textarea><div class="acts"><a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener">${icon('wa')}افتح واتساب</a><button class="btn" id="cp">${icon('copy')}نسخ النص</button></div>`);
      ov.querySelector('#cp').onclick=()=>{const ta=ov.querySelector('textarea');const done=()=>toast('انسخ النص');const fb=()=>{ta.select();document.execCommand('copy');done();};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,fb);else fb();};break;}
    case 'xls-stmt':exportStmt();break;
    case 'xls-month':exportMonth();break;
    case 'xls-all':exportAll();break;
    case 'backup':backup();break;
    case 'ai':askAI($('#ai-in')?.value);break;
    case 'ai-q':{const i=$('#ai-in');if(i)i.value=a.dataset.v;askAI(a.dataset.v);break;}
  }
});
document.addEventListener('input',e=>{const t=e.target;
  const box=t.closest('[data-entry]');
  if(box&&t.dataset.f){setField(box.dataset.entry,t.dataset.f,t.dataset.f==='note'?t.value:num(t.value));}
  else if(t.matches('[data-o]')&&t.closest('.daily'))onDailyInput(t);
  else if(t.matches('[data-set]'))onSetInput(t);
  else if(t.dataset.act==='dq'){S.dq=t.value;const l=$('#dlist');if(l)l.innerHTML=distRows();}
  else if(t.dataset.mp)onMatrixInput(t);
  else if(t.dataset.lq){const q=S.ldraft||(S.ldraft={});q[t.dataset.lq]=num(t.value);}
  else if(t.dataset.sk){const q=S.sdraft||(S.sdraft=clone(S.stock.q||{}));q[t.dataset.sk]=num(t.value);stockTot();}
  else if(t.dataset.pc)onCostInput(t);
  else if(t.dataset.act==='pq'){S.pq=t.value;const tb=$('#ptb');if(tb)tb.innerHTML=priceBody();}
  else if(t.dataset.act==='cq'){S.cq=t.value;const tb=$('#ctb');if(tb)tb.innerHTML=custRows(custFiltered());}
});
document.addEventListener('change',e=>{const t=e.target;const act=t.dataset.act;
  if(t.closest('.daily')&&t.dataset.o&&!['ops.note','storeNote'].includes(t.dataset.o)){const lab=t.closest('label');const name=lab?(lab.querySelector('span')?.textContent||lab.childNodes[0]?.textContent||''):'';logEvent('prod',`${name.trim()}: ${t.value.trim()||'فاضي'}`+(S.sel!==today()?` (ليوم ${dShort(S.sel)})`:''));}
  if(act==='ldp'&&t.value){S.ld=t.value;render();return;}
  if(t.dataset.rm){patchDoc('bakery/customers',{list:{[t.dataset.rm]:{remind:t.checked}}},100);return;}
  if(act==='pick'&&t.value)selectDate(t.value);
  else if(act==='sc'){S.sc=t.value;render();}
  else if(act==='rm'){S.rm=t.value;render();}
  else if(act==='sf'||act==='sto'){S[act]=t.value;render();}
  else if(act==='restore'&&t.files[0]){restore(t.files[0]);t.value='';}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(!t.matches('input.n'))return;e.preventDefault();
  const all=[...document.querySelectorAll('#main input.n:not([disabled])')].filter(x=>x.offsetParent!==null);const i=all.indexOf(t);if(i>-1&&all[i+1]){all[i+1].focus();}else t.blur();});
document.addEventListener('focusin',e=>{if(e.target.matches('input.n'))setTimeout(()=>e.target.select?.(),0);});

/* ---------- start ---------- */
(function start(){S.sess=session();const v=location.hash.slice(1);if(VIEWS[v]&&v!=='entry')S.view=v;render();Store.init();})();
</script>
